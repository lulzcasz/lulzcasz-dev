<div class="mt-3 mb-1 p-2 rounded-lg bg-brand-gray border border-neutral-800 flex flex-wrap items-center gap-4 w-fit max-w-full">
    
    <div class="pl-2 flex items-center text-neutral-500">
        <i class="fa-solid fa-cart-shopping text-base"></i>
    </div>

    <div class="flex flex-wrap gap-2 items-center pr-1">
        {% for link in product.get_active_links %}
            <a href="{{ link.resolved_url }}" target="_blank" rel="noopener noreferrer"
               class="affiliate-btn flex items-center justify-center h-10 px-4 rounded-md bg-brand-black border border-neutral-700 text-neutral-300 hover:border-neutral-400 hover:text-white transition-all duration-200 text-sm font-medium no-underline">
                {{ link.store.name }}
            </a>
        {% endfor %}
    </div>
    
</div>
